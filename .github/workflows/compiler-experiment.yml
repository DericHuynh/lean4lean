name: Experimental Lean Compiler

on:
  push:
    branches: [experiment/lean4-resource-compiler]
  pull_request:
    paths:
      - "Lean4LeanCompiler/**"
      - "Lean4LeanCompiler.lean"
      - "lakefile.toml"
      - ".github/workflows/compiler-experiment.yml"
  workflow_dispatch:

jobs:
  compiler-model-and-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject new admitted claims
        run: |
          if grep -R -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' Lean4LeanCompiler; then
            echo "Forbidden admitted proof dependency in compiler component"
            exit 1
          fi
      - name: Build model, proofs and compiled examples with pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "true"
          build-args: "Lean4LeanCompiler lean4leanCompilerDemo"
          use-mathlib-cache: "false"
      - name: Differential compiled Lean smoke test
        run: lake exe lean4leanCompilerDemo
