name: Native from actual LCNF

on:
  push:
    branches: [experiment/lcnf-native-importer]
  pull_request:
    paths:
      - "Lean4LeanCompiler/**"
      - "Lean4LeanCompiler.lean"
      - "lakefile.toml"
      - "tests/native-from-lcnf.c"
      - "tests/native-from-lcnf-second.c"
      - ".github/workflows/lcnf-native.yml"
  workflow_dispatch:

jobs:
  native-lcnf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject new proof admissions
        run: |
          if grep -R -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' Lean4LeanCompiler; then
            echo "Unexpected compiler proof admission"
            exit 1
          fi
      - name: Build pinned Lean importer and native CLI
        uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "true"
          build-args: "Lean4LeanCompiler.Native.SourceLink lean4leanFromLCNF lean4leanCheckNative"
          use-mathlib-cache: "false"
      - name: Generate native ELF from actual compiled Lean LCNF
        run: |
          mkdir -p .lake/build/native
          lake exe lean4leanFromLCNF .lake/build/native/from_lcnf.o
          readelf -hW -SW -sW .lake/build/native/from_lcnf.o
          objdump -dr .lake/build/native/from_lcnf.o
      - name: Independently validate object and reject a mutated ELF
        run: |
          lake exe lean4leanCheckNative .lake/build/native/from_lcnf.o
          cp .lake/build/native/from_lcnf.o .lake/build/native/corrupt.o
          printf '\0' | dd of=.lake/build/native/corrupt.o bs=1 seek=64 count=1 conv=notrunc
          if lake exe lean4leanCheckNative .lake/build/native/corrupt.o; then
            echo "ERROR: artifact validator accepted corrupted native bytes"
            exit 1
          fi
      - name: Check 200000 randomized scalar ABI cases
        run: |
          cc -std=c11 -O3 -fno-lto -Wall -Wextra -Werror \
            -Wl,-z,noexecstack tests/native-from-lcnf.c \
            .lake/build/native/from_lcnf.o \
            -o .lake/build/native/from-lcnf-test
          .lake/build/native/from-lcnf-test
      - name: Emit second-argument native code from another ordinary Lean declaration
        run: |
          lake exe lean4leanFromLCNF returnSecond .lake/build/native/from_lcnf_second.o
          lake exe lean4leanCheckNative returnSecond .lake/build/native/from_lcnf_second.o
          objdump -dr .lake/build/native/from_lcnf_second.o
      - name: Fail closed when source certificate does not match the ELF object
        run: |
          if lake exe lean4leanCheckNative returnSecond .lake/build/native/from_lcnf.o; then
            echo "ERROR: first-argument object accepted for second-argument source"
            exit 1
          fi
          if lake exe lean4leanCheckNative returnScalar .lake/build/native/from_lcnf_second.o; then
            echo "ERROR: second-argument object accepted for first-argument source"
            exit 1
          fi
      - name: Validate two-argument SysV ABI with randomized calls
        run: |
          cc -std=c11 -O3 -fno-lto -Wall -Wextra -Werror \
            -Wl,-z,noexecstack \
            tests/native-from-lcnf-second.c .lake/build/native/from_lcnf_second.o \
            -o .lake/build/native/from-lcnf-second-test
          .lake/build/native/from-lcnf-second-test
