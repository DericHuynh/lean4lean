name: Morphic Lifetime Pilot
on:
  push:
    branches: [experiment/morphic-lifetime-probe]
  pull_request:
    paths:
      - "Lean4LeanCompiler/MorphicLifetimePilot.lean"
      - "Lean4LeanCompiler/MorphicPilotExamples.lean"
      - ".github/workflows/morphic-lifetime-pilot.yml"
      - "lakefile.toml"
  workflow_dispatch:

jobs:
  test-mode-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Lean proof file contains no new admits
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' Lean4LeanCompiler/MorphicLifetimePilot.lean; then exit 1; fi
      - name: Build complete bounded LCNF direct-transfer checker and kernel proofs
        uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "true"
          build-args: "Lean4LeanCompiler.MorphicBorrowCheckTests"
          use-mathlib-cache: "false"
